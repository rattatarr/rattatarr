<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140">

    <!-- Tail (draw first, behind body) -->
    <path d="M 38 95 Q 15 90 10 70 Q 5 48 20 36"
          fill="none" stroke="#6B4F9E" stroke-width="6"
          stroke-linecap="round"/>

    <!-- Star at tail tip -->
    <polygon
            points="20,22 22.9,31 32,31 24.5,36.5 27.4,45.5 20,40 12.6,45.5 15.5,36.5 8,31 17.1,31"
            fill="#F5C518" stroke="#D4A800" stroke-width="0.8"/>

    <!-- Body -->
    <ellipse cx="75" cy="88" rx="36" ry="24" fill="#9B7FBE"/>

    <!-- Belly -->
    <ellipse cx="82" cy="92" rx="20" ry="14" fill="#F5E6C8"/>

    <!-- Head -->
    <circle cx="112" cy="72" r="22" fill="#9B7FBE"/>

    <!-- Ear left -->
    <ellipse cx="103" cy="52" rx="8" ry="11"
             fill="#9B7FBE" transform="rotate(-15 103 52)"/>
    <ellipse cx="103" cy="53" rx="4.5" ry="7"
             fill="#E87BA0" transform="rotate(-15 103 53)"/>

    <!-- Ear right -->
    <ellipse cx="119" cy="49" rx="8" ry="11"
             fill="#9B7FBE" transform="rotate(10 119 49)"/>
    <ellipse cx="119" cy="50" rx="4.5" ry="7"
             fill="#E87BA0" transform="rotate(10 119 50)"/>

    <!-- Eye -->
    <circle cx="124" cy="68" r="5" fill="#1A1A2E"/>
    <circle cx="125.5" cy="66.5" r="1.8" fill="white"/>

    <!-- Nose -->
    <ellipse cx="134" cy="76" rx="4" ry="3" fill="#E87BA0"/>

    <!-- Whiskers top -->
    <line x1="133" y1="73" x2="152" y2="68" stroke="#6B4F9E" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="133" y1="75" x2="153" y2="74" stroke="#6B4F9E" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Whiskers bottom -->
    <line x1="133" y1="78" x2="152" y2="80" stroke="#6B4F9E" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="133" y1="80" x2="151" y2="86" stroke="#6B4F9E" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Teeth -->
    <rect x="127" y="82" width="5" height="7" rx="1.5" fill="#FFFDF0" stroke="#D4D0C0" stroke-width="0.5"/>
    <rect x="133" y="82" width="5" height="7" rx="1.5" fill="#FFFDF0" stroke="#D4D0C0" stroke-width="0.5"/>

    <!-- Front legs -->
    <ellipse cx="95" cy="108" rx="8" ry="5" fill="#7B5EA7"/>
    <ellipse cx="108" cy="110" rx="8" ry="5" fill="#7B5EA7"/>

    <!-- Hind legs -->
    <ellipse cx="58" cy="107" rx="9" ry="5" fill="#7B5EA7"/>
    <ellipse cx="44" cy="106" rx="8" ry="5" fill="#7B5EA7"/>

</svg>