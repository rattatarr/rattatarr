name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write

jobs:
  test-server:
    name: Server Tests (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'server/pom.xml'

      - name: Run tests with Maven
        run: ./mvnw clean test

      - name: Generate test report
        if: always() && !env.ACT
        uses: dorny/test-reporter@v1
        with:
          name: Maven Test Results
          path: server/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
          token: ${{ github.token }}

  test-client:
    name: Client Tests (Vue/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'client/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm type-check

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test:run

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Vitest Test Results
          path: client/test-results/junit.xml
          reporter: java-junit
          fail-on-error: true
          token: ${{ github.token }}
