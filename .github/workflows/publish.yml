name: Publish

# Triggered when release-please merges a Release PR and creates a version tag.
# Can also be triggered manually for one-off builds.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Required to push to GHCR and to read repo contents.
permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & push Docker image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extracts metadata (tags, labels) for the image.
      # Produces:
      #   latest          → always points to the newest release
      #   v1.2.3          → exact semver tag
      #   v1.2, v1        → floating major/minor convenience tags
      #   sha-<short-sha> → immutable per-commit tag for rollbacks
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build-kit layer caching backed by the GitHub Actions cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
