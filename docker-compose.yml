services:
  rattatarr:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rattatarr
    restart: unless-stopped
    ports:
      - "${RATTATARR_PORT:-80}:80"
    volumes:
      - rattatarr-data:/data
    environment:
      RATTATARR_CORS_ALLOWED_ORIGINS: ""
      RATTATARR_JELLYFIN_BASE_URL: "${JELLYFIN_BASE_URL:-http://localhost:8096}"
      RATTATARR_JELLYFIN_API_KEY: "${JELLYFIN_API_KEY:-}"

volumes:
  rattatarr-data:
