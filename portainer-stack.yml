# Portainer Stack — Rattatarr
#
# Deploy this file via Portainer → Stacks → Add stack → Upload.
#
# Required environment variables — set them in Portainer's "Environment variables"
# tab when deploying the stack (or in a .env file if using Portainer's Git source):
#
#   JELLYFIN_BASE_URL   e.g. http://192.168.1.10:8096
#   JELLYFIN_API_KEY    your Jellyfin API key
#
# Optional:
#   RATTATARR_PORT      host port to expose (default: 80)
#   DATA_PATH           absolute path on the host for the SQLite database
#                       e.g. /opt/rattatarr/data  (default: a named Docker volume)

services:
  rattatarr:
    image: ghcr.io/cibotariulavinia/rattatarr:latest
    container_name: rattatarr
    restart: unless-stopped
    ports:
      - "${RATTATARR_PORT:-80}:80"
    volumes:
      - "${DATA_PATH:-rattatarr-data}:/data"
    environment:
      RATTATARR_JELLYFIN_BASE_URL: "${JELLYFIN_BASE_URL}"
      RATTATARR_JELLYFIN_API_KEY: "${JELLYFIN_API_KEY}"
      # Uncomment and set if you need to allow extra origins to reach the API directly.
      # RATTATARR_CORS_ALLOWED_ORIGINS: "http://myserver.local"

volumes:
  rattatarr-data:
